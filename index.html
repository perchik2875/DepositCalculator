<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Калькулятор вклада</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3eee6;
            color: #292723;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 520px;
            background: #fffdf9;
            border: 1px solid #ded7cc;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            color: #77716a;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .clock {
            background: #f5f1eb;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 22px;
            font-size: 14px;
            color: #625c55;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #625c55;
        }

        input,
        select {
            width: 100%;
            border: 1px solid #d8d0c5;
            border-radius: 10px;
            padding: 12px 13px;
            background: #fff;
            color: #292723;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #9b9184;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            background: #292723;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 24px;
            border-top: 1px solid #e4ddd3;
            padding-top: 22px;
        }

        .result-main {
            background: #f5f1eb;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .result-label {
            font-size: 13px;
            color: #77716a;
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 30px;
            font-weight: 600;
        }

        .details {
            display: grid;
            gap: 10px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 14px;
        }

        .detail span:first-child {
            color: #77716a;
        }

        .detail span:last-child {
            font-weight: 500;
            text-align: right;
        }

        .error {
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #f7e8e5;
            color: #9a4438;
            font-size: 14px;
            display: none;
        }

        @media (max-width: 520px) {
            .calculator {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }

            .result-value {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Калькулятор вклада</h1>

    <div class="subtitle">
        Расчёт доходности с месячной капитализацией
    </div>

    <div class="clock">
        <div id="currentDate">Дата: —</div>
        <div id="currentTime">Время: —</div>
    </div>

    <div class="field">
        <label for="amount">Сумма вклада</label>
        <input
            type="number"
            id="amount"
            value="100000"
            min="0"
            step="0.01"
        >
    </div>

    <div class="field">
        <label for="rate">Годовая ставка, %</label>
        <input
            type="number"
            id="rate"
            value="15"
            min="0"
            step="0.01"
        >
    </div>

    <div class="field">
        <label for="rateType">Тип ставки</label>

        <select id="rateType">
            <option value="effective">
                Эффективная годовая ставка
            </option>

            <option value="nominal">
                Номинальная ставка + месячная капитализация
            </option>
        </select>
    </div>

    <div class="field">
        <label for="startDate">Дата открытия</label>
        <input
            type="date"
            id="startDate"
        >
    </div>

    <button onclick="calculateDeposit()">
        Рассчитать
    </button>

    <div class="error" id="error"></div>

    <div class="result" id="result">

        <div class="result-main">
            <div class="result-label">
                Сумма на текущую дату
            </div>

            <div class="result-value" id="finalAmount">
                — ₽
            </div>
        </div>

        <div class="details">

            <div class="detail">
                <span>Начальная сумма</span>
                <span id="initialAmount">—</span>
            </div>

            <div class="detail">
                <span>Заработано</span>
                <span id="profit">—</span>
            </div>

            <div class="detail">
                <span>Годовая ставка</span>
                <span id="displayRate">—</span>
            </div>

            <div class="detail">
                <span>Тип ставки</span>
                <span id="displayRateType">—</span>
            </div>

            <div class="detail">
                <span>Дата открытия</span>
                <span id="displayStartDate">—</span>
            </div>

            <div class="detail">
                <span>Прошло дней</span>
                <span id="daysPassed">—</span>
            </div>

            <div class="detail">
                <span>Капитализаций</span>
                <span id="capitalizations">—</span>
            </div>

        </div>
    </div>

</div>

<script>
    // ==============================
    // ЧАСЫ И ДАТА
    // ==============================

    function updateClock() {
        const now = new Date();

        const date = new Intl.DateTimeFormat('ru-RU', {
            timeZone: 'Europe/Moscow',
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        }).format(now);

        const time = new Intl.DateTimeFormat('ru-RU', {
            timeZone: 'Europe/Moscow',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        }).format(now);

        document.getElementById('currentDate').textContent =
            'Дата: ' + date;

        document.getElementById('currentTime').textContent =
            'Время: ' + time;
    }

    updateClock();
    setInterval(updateClock, 1000);


    // ==============================
    // ТЕКУЩАЯ ДАТА ПО МОСКВЕ
    // ==============================

    function getMoscowDateString() {
        const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Europe/Moscow',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }).formatToParts(new Date());

        const year = parts.find(p => p.type === 'year').value;
        const month = parts.find(p => p.type === 'month').value;
        const day = parts.find(p => p.type === 'day').value;

        return `${year}-${month}-${day}`;
    }


    // ==============================
    // ДОБАВЛЕНИЕ МЕСЯЦА
    // ==============================

    /*
        Например:

        15 января -> 15 февраля
        15 февраля -> 15 марта
        15 марта -> 15 апреля

        Для 29/30/31 числа используется
        последний доступный день месяца.
    */

    function getMonthlyCapitalizationDate(startDate, monthIndex) {
        const originalDay = startDate.getUTCDate();

        const firstDayOfTargetMonth = new Date(Date.UTC(
            startDate.getUTCFullYear(),
            startDate.getUTCMonth() + monthIndex,
            1
        ));

        const lastDayOfTargetMonth = new Date(Date.UTC(
            firstDayOfTargetMonth.getUTCFullYear(),
            firstDayOfTargetMonth.getUTCMonth() + 1,
            0
        )).getUTCDate();

        const day = Math.min(
            originalDay,
            lastDayOfTargetMonth
        );

        return new Date(Date.UTC(
            firstDayOfTargetMonth.getUTCFullYear(),
            firstDayOfTargetMonth.getUTCMonth(),
            day
        ));
    }


    // ==============================
    // РАСЧЁТ
    // ==============================

    function calculateDeposit() {

        const errorElement = document.getElementById('error');

        errorElement.style.display = 'none';
        errorElement.textContent = '';

        const amount = parseFloat(
            document.getElementById('amount').value
        );

        const annualRatePercent = parseFloat(
            document.getElementById('rate').value
        );

        const rateType =
            document.getElementById('rateType').value;

        const startDateString =
            document.getElementById('startDate').value;


        // ==============================
        // ПРОВЕРКА ДАННЫХ
        // ==============================

        if (!amount || amount <= 0) {
            showError('Введите корректную сумму вклада.');
            return;
        }

        if (isNaN(annualRatePercent) || annualRatePercent < 0) {
            showError('Введите корректную годовую ставку.');
            return;
        }

        if (!startDateString) {
            showError('Выберите дату открытия вклада.');
            return;
        }


        // ==============================
        // ТЕКУЩАЯ ДАТА
        // ==============================

        const currentDateString = getMoscowDateString();

        const startDate = new Date(
            startDateString + 'T00:00:00Z'
        );

        const currentDate = new Date(
            currentDateString + 'T00:00:00Z'
        );


        // Нельзя открыть вклад в будущем

        if (startDate > currentDate) {
            showError(
                'Дата открытия не может быть в будущем.'
            );
            return;
        }


        // ==============================
        // СТАВКА
        // ==============================

        const annualRate =
            annualRatePercent / 100;


        /*
            Эффективная годовая ставка:

            Чтобы после 12 капитализаций
            получить ровно указанную годовую
            эффективную ставку:

            monthlyRate =
            (1 + annualRate)^(1/12) - 1
        */

        let monthlyRate;

        if (rateType === 'effective') {

            monthlyRate =
                Math.pow(
                    1 + annualRate,
                    1 / 12
                ) - 1;

        } else {

            /*
                Номинальная ставка:

                15% / 12 = 1.25% в месяц
            */

            monthlyRate =
                annualRate / 12;
        }


        // ==============================
        // РАСЧЁТ КАПИТАЛИЗАЦИЙ
        // ==============================

        let balance = amount;

        let capitalizations = 0;

        let monthIndex = 1;


        while (true) {

            const capitalizationDate =
                getMonthlyCapitalizationDate(
                    startDate,
                    monthIndex
                );

            // Следующая капитализация ещё не наступила

            if (capitalizationDate > currentDate) {
                break;
            }


            // Начисляем проценты

            balance =
                balance * (1 + monthlyRate);

            capitalizations++;

            monthIndex++;
        }


        // ==============================
        // КОЛИЧЕСТВО ДНЕЙ
        // ==============================

        const millisecondsPerDay =
            1000 * 60 * 60 * 24;

        const daysPassed = Math.floor(
            (currentDate - startDate) /
            millisecondsPerDay
        );


        // ==============================
        // ПРИБЫЛЬ
        // ==============================

        const profit = balance - amount;


        // ==============================
        // ВЫВОД РЕЗУЛЬТАТА
        // ==============================

        document.getElementById('finalAmount').textContent =
            formatMoney(balance) + ' ₽';

        document.getElementById('initialAmount').textContent =
            formatMoney(amount) + ' ₽';

        document.getElementById('profit').textContent =
            formatMoney(profit) + ' ₽';

        document.getElementById('displayRate').textContent =
            formatPercent(annualRatePercent);

        document.getElementById('displayRateType').textContent =
            rateType === 'effective'
                ? 'Эффективная годовая'
                : 'Номинальная';

        document.getElementById('displayStartDate').textContent =
            formatDate(startDate);

        document.getElementById('daysPassed').textContent =
            daysPassed;

        document.getElementById('capitalizations').textContent =
            capitalizations;
    }


    // ==============================
    // ОШИБКА
    // ==============================

    function showError(message) {

        const errorElement =
            document.getElementById('error');

        errorElement.textContent = message;
        errorElement.style.display = 'block';
    }


    // ==============================
    // ФОРМАТИРОВАНИЕ ДЕНЕГ
    // ==============================

    function formatMoney(value) {

        return new Intl.NumberFormat('ru-RU', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(value);
    }


    // ==============================
    // ФОРМАТИРОВАНИЕ ПРОЦЕНТА
    // ==============================

    function formatPercent(value) {

        return new Intl.NumberFormat('ru-RU', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }).format(value) + ' %';
    }


    // ==============================
    // ФОРМАТ ДАТЫ
    // ==============================

    function formatDate(date) {

        return new Intl.DateTimeFormat('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            timeZone: 'UTC'
        }).format(date);
    }


    // ==============================
    // УСТАНОВКА ДАТЫ ПО УМОЛЧАНИЮ
    // ==============================

    document.getElementById('startDate').value =
        getMoscowDateString();


    // ==============================
    // АВТОМАТИЧЕСКИЙ ПЕРЕСЧЁТ
    // ==============================

    document.getElementById('amount')
        .addEventListener('input', calculateDeposit);

    document.getElementById('rate')
        .addEventListener('input', calculateDeposit);

    document.getElementById('rateType')
        .addEventListener('change', calculateDeposit);

    document.getElementById('startDate')
        .addEventListener('change', calculateDeposit);


    // Первый расчёт

    calculateDeposit();

</script>

</body>
</html>
